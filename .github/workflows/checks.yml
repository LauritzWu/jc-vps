name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Bash scripts
        run: |
          for script in bootstrap.sh duo.sh manager.sh; do
            bash -n "$script"
          done
          shellcheck --severity=error bootstrap.sh duo.sh manager.sh
          bash duo.sh --help
          if bash bootstrap.sh invalid; then
            echo 'Bootstrap accepted an invalid revision'
            exit 1
          else
            test "$?" -eq 2
          fi
      - name: Check client template and bootstrap hashes
        run: |
          jq -e 'type == "object" and (.outbounds | type == "array")' client-template.json
          sed -nE '/^[0-9a-f]{64}  (manager\.sh|client-template\.json)$/p' bootstrap.sh > /tmp/jc.sha256
          test "$(cut -c67- /tmp/jc.sha256 | sort)" = "$(printf '%s\n' client-template.json manager.sh)"
          sha256sum --strict --check /tmp/jc.sha256
